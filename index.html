  <script>
    // Defensive fix for AI Studio sandbox read-only window.fetch getter
    (function () {
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && desc.get && !desc.set) {
          let _currentFetch = desc.get.call(window);
          Object.defineProperty(window, 'fetch', {
            get() { return _currentFetch; },
            set(fn) { _currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Sandbox fetch patch bypassed:', e);
      }
    })();
  </script>
